name: Meeting profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Profile voting records and member links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run --bun check
      - run: bun test scripts/tests/member-mentions.test.ts scripts/tests/meeting-video.test.ts scripts/tests/legislation-display.test.ts scripts/tests/people-build.test.ts scripts/tests/profile-fetch.test.ts
