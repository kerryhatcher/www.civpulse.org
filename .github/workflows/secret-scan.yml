name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    name: TruffleHog (changed commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Scan for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then args+=(--since-commit "$BASE"); fi
          docker run --rm -v "$PWD:/repo" ghcr.io/trufflesecurity/trufflehog@sha256:2ec535840f860aa27f11fee20222fb790326ecd66325c96bd49d02ec6af46eca \
            git file:///repo --branch "$HEAD" "${args[@]}" --results=verified,unverified,unknown --json --no-update > /tmp/findings.jsonl
          bun scripts/filter-secret-findings.mjs /tmp/findings.jsonl

  full-history:
    name: TruffleHog (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan full history
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unverified,unknown
